<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 3 29 16 16 29 3 16Z%27 fill=%27none%27 stroke=%27%23326c55%27 stroke-width=%272%27/%3E%3C/svg%3E">
  <title>数据安全融合 · 原理验证</title>
  <link rel="stylesheet" href="assets/lab.css?v=nav-copy-20261104-3">
</head>
<body>
<header class="top"><a class="brand" href="#sgboost/overview"><span class="brand-icon" aria-hidden="true">◇</span>数据安全融合</a></header>
<div class="layout">
  <aside><nav id="project-nav" aria-label="项目导航"></nav></aside>
  <main id="workspace">
    <header class="project-header">
      <div><h1 id="detail-title">SGBoost</h1><p id="detail-desc"></p></div>
      <div class="project-actions"><button class="secondary" id="start-presentation">分步演示 ▷</button><button class="primary" id="run-experiment">运行实验</button></div>
    </header>
    <div id="run-state" class="run-state" role="status" aria-live="polite"><span class="run-dot"></span><span id="run-state-text">正在读取运行记录</span></div>
    <div class="project-tabs" role="tablist" aria-label="项目内容">
      <button id="tab-overview" role="tab" data-tab="overview" aria-controls="view-overview">项目概览</button>
      <button id="tab-results" role="tab" data-tab="results" aria-controls="view-results">实验结果</button>
      <button id="tab-environment" role="tab" data-tab="environment" aria-controls="view-environment">环境状态</button>
    </div>
    <section id="view-overview" class="project-view" role="tabpanel" aria-labelledby="tab-overview">
      <div class="section-heading demo-section-heading"><h2 id="demo-heading">角色与流程</h2><div class="animation-switch" role="tablist" aria-label="动画视图"><button role="tab" data-demo-view="experiment" aria-controls="detail-protocol">实验过程</button><button role="tab" data-demo-view="roles" aria-controls="detail-protocol">角色交互</button></div></div>
      <div id="detail-protocol" class="overview-protocol"></div>
      <div class="project-intro"><h2>实验配置</h2><p id="project-config"></p><a class="secondary hidden" id="detail-link" href="http://127.0.0.1:8000/" target="_blank" rel="noopener">打开 VisualFL 实验台 ↗</a></div>
    </section>
    <section id="view-results" class="project-view" role="tabpanel" aria-labelledby="tab-results" hidden>
      <div class="section-heading"><h2>实验结果</h2><span id="result-time"></span></div>
      <div id="detail-metrics" class="metric-grid"></div><div id="detail-chart"></div>
      <p id="result-note" class="result-note"></p>
      <details class="raw-output"><summary>查看完整运行输出</summary><pre id="experiment-output"></pre></details>
    </section>
    <section id="view-environment" class="project-view" role="tabpanel" aria-labelledby="tab-environment" hidden>
      <div class="section-heading"><h2>环境状态</h2><button class="secondary" id="refresh">刷新检测 ↻</button></div>
      <div id="env-list" aria-live="polite">正在检查环境…</div>
      <div class="environment-help"><h2>运行说明</h2><p id="detail-help"></p></div>
    </section>
  </main>
</div>
<dialog id="presentation" class="presentation" tabindex="-1" aria-labelledby="replay-title">
  <div class="dialog-head"><h2 id="replay-title">项目演示</h2><button class="close" id="close-presentation" aria-label="关闭演示">×</button></div>
  <div class="replay-toolbar"><div class="animation-switch" role="tablist" aria-label="回放动画视图"><button role="tab" data-demo-view="experiment" aria-controls="replay-content">实验过程</button><button role="tab" data-demo-view="roles" aria-controls="replay-content">角色交互</button></div><label class="playback-speed">速度 <select id="playback-rate" aria-label="播放速度"><option value="1.5">1.5×</option><option value="1.75" selected>1.75×</option></select></label></div><div class="replay-flow" aria-label="演示流程"><div data-stage="0"><b>01</b><span>数据与配置</span></div><i></i><div data-stage="1"><b>02</b><span>运行记录</span></div><i></i><div data-stage="2"><b>03</b><span>结果与验证</span></div></div>
  <div id="replay-content" class="replay-content"></div>
  <div class="replay-controls"><span id="replay-position" aria-live="polite"></span><div><button id="replay-prev" class="secondary">上一步</button><button id="replay-play" class="primary">播放</button><button id="replay-next" class="secondary">下一步</button></div></div>
</dialog>
<script src="assets/project-demos.js?v=nav-copy-20261104-3"></script><script src="assets/demo-views.js?v=nav-copy-20261104-3"></script><script src="assets/presentation.js?v=nav-copy-20261104-3"></script><script src="assets/lab.js?v=nav-copy-20261104-3"></script>
</body></html>
